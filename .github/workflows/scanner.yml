name: Scanner Polymarket

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code (avec DB)
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Préparer les dossiers
        run: mkdir -p data logs

      - name: Lancer le scanner
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Sauvegarder la base de données
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add data/polymarket.db
          git diff --staged --quiet || git commit -m "chore: update DB [skip ci]"
          git push
