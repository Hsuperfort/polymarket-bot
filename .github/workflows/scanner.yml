name: Scanner Polymarket

on:
  schedule:
    - cron: '0,30 * * * *'   # toutes les 30 min (à :00 et :30)
  workflow_dispatch:           # déclenchement manuel depuis GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restaurer la base de données
        uses: actions/cache@v4
        with:
          path: data/polymarket.db
          key: polymarket-db-${{ github.run_number }}
          restore-keys: |
            polymarket-db-

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Préparer les dossiers
        run: mkdir -p data logs

      - name: Lancer le scanner
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
